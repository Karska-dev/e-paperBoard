; PlatformIO project file: how to build the firmware.
;
; PATTERN: reproducible build. Every dependency is pinned to an exact version
; (platform URL, library commit). The same source gives the same binary next
; year, and an update is a reviewable change to this file.

[platformio]
default_envs = xiao-epaper

; Settings shared by all environments below.
[env]
; pioarduino: the community-maintained ESP32 platform. Release 55.03.39
; ships Arduino-ESP32 core 3.3.9 and runs on Python 3.10 to 3.14 (releases
; up to 55.03.36 stop on Python 3.14).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino

; Our own board file (boards/): PlatformIO ships only the non-Plus XIAO
; ESP32-S3 with 8 MB flash; ours is the Plus with 16 MB.
board = seeed_xiao_esp32s3_plus
board_build.partitions = partitions.csv
; One app slot is 3 MB (partitions.csv). The build fails if the firmware
; outgrows it, and never produces a binary that cannot be flashed.
board_upload.maximum_size = 3145728

; Seeed_GFX is pinned to a commit, not a tag: its version number says "2.0.3"
; on every commit, and the tag V2.0.3 predates our EE04 board. This is master
; on 2026-09-04, the version tested on our unit.
lib_deps =
    https://github.com/Seeed-Studio/Seeed_GFX.git#0dfdd7135425be82b5bb4b4b58d74dd51ab29a59

build_flags =
    ; Seeed_GFX finds its configuration in a file called driver.h. This puts
    ; our include/ folder on the libraries' include path as well.
    -I include

; Strict warnings for OUR code only: build_src_flags does not apply to
; libraries, whose warnings we cannot fix.
build_src_flags =
    -Wall
    -Wextra

; Before every build: write the firmware version (from git) into
; include/fw_version.h.
extra_scripts = pre:scripts/git_version.py

monitor_speed = 115200
; Turns crash addresses on the serial port into file:line.
monitor_filters = esp32_exception_decoder

; ---------------------------------------------------------------------------
; The normal firmware.
[env:xiao-epaper]
build_type = release

; ---------------------------------------------------------------------------
; Desk build. After each wake the USB serial port takes about a second to
; reconnect and early log lines are lost, so this build waits 2 s first.
; Do not judge battery life with it.
[env:xiao-epaper-debug]
build_type = debug
build_flags =
    ${env.build_flags}
    -DEPB_BOOT_DELAY_MS=2000
    -DCORE_DEBUG_LEVEL=3

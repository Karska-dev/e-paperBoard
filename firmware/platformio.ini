; PlatformIO project file: describes how to build the firmware.
;
; PATTERN: reproducible build (pin everything).
; Every moving part below is fixed to one exact version: the toolchain and
; ESP32 core (through the platform URL), and the display library (through a
; commit hash). Building this repository next year gives the same binary as
; today, and an update of a dependency is a deliberate, reviewable change to
; this file instead of something that happens silently on someone's machine.

[platformio]
default_envs = xiao-epaper

; Settings shared by all environments below.
[env]
; pioarduino is the community-maintained ESP32 platform for PlatformIO.
; Release 55.03.39 ships Arduino-ESP32 core 3.3.9 (ESP-IDF 5.5). It is also
; the reason for this exact release: it runs on Python 3.10 to 3.14, while
; releases up to 55.03.36 stop with an error on Python 3.14.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino

; Board definition from boards/seeed_xiao_esp32s3_plus.json in this folder.
; PlatformIO only ships the non-Plus XIAO ESP32-S3 (8 MB flash); ours is the
; Plus (16 MB flash, more pins), so we describe it ourselves.
board = seeed_xiao_esp32s3_plus
board_build.partitions = partitions.csv
; One app slot is 3 MB (see partitions.csv). The build fails if the firmware
; grows beyond it, instead of producing a binary that cannot be flashed.
board_upload.maximum_size = 3145728

; Seeed_GFX is pinned to an exact commit instead of a version tag. Its
; library.properties says "2.0.3" on every commit, so the version number
; identifies nothing; the tag V2.0.3 predates support for our EE04 board.
; This commit is the head of master on 2026-09-04, which is what a GitHub
; ZIP download contained when the display was tested on our unit (2026-10-05).
lib_deps =
    https://github.com/Seeed-Studio/Seeed_GFX.git#0dfdd7135425be82b5bb4b4b58d74dd51ab29a59

build_flags =
    ; Seeed_GFX looks for a file named driver.h to learn which board and
    ; panel it is driving. Ours is in include/; this puts that folder on the
    ; include path of libraries too (by default only our own code sees it).
    -I include

; Strict warnings for OUR code only (build_src_flags does not apply to
; libraries, whose warnings we cannot fix and would only bury our own).
build_src_flags =
    -Wall
    -Wextra

; Runs before every build and writes the firmware version (from git) into
; include/fw_version.h.
extra_scripts = pre:scripts/git_version.py

monitor_speed = 115200
; Decodes crash addresses printed on the serial port into file:line.
monitor_filters = esp32_exception_decoder

; ---------------------------------------------------------------------------
; The normal firmware.
[env:xiao-epaper]
build_type = release

; ---------------------------------------------------------------------------
; For working at the desk with the USB cable plugged in.
; After every wake the USB serial port has to reconnect to the computer,
; which takes about a second, and everything logged before that is lost.
; This build waits at the start of each wake so the first log lines show up.
; Do not judge battery life with this build.
[env:xiao-epaper-debug]
build_type = debug
build_flags =
    ${env.build_flags}
    -DEPB_BOOT_DELAY_MS=2000
    -DCORE_DEBUG_LEVEL=3
